<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Jump Adventure</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #7ec8ff;
    color: #1a3a5c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h1 { margin: 4px 0 8px; font-size: 32px; color: #fff; text-shadow: 2px 2px 0 #2a6cb0; }
  #bar {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    background: #fff8d6; border-radius: 16px; padding: 10px 18px;
    font-size: 22px; font-weight: bold; margin-bottom: 8px; width: min(760px, 100%);
  }
  #msg {
    min-height: 36px; font-size: 22px; font-weight: bold; color: #fff;
    text-shadow: 1px 1px 0 #2a6cb0; margin: 4px 0 8px; text-align: center;
  }
  canvas {
    background: #b7e4ff;
    border: 6px solid #fff;
    border-radius: 18px;
    max-width: 100%;
    touch-action: none;
    box-shadow: 0 8px 0 #4aa3e0;
  }
  #controls {
    display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; justify-content: center;
  }
  button.arrow {
    font-size: 42px; line-height: 1; padding: 16px 28px; border: none; border-radius: 20px;
    background: #ffd54a; color: #3a2a00; font-weight: bold; cursor: pointer;
    box-shadow: 0 6px 0 #d4a017; min-width: 96px; min-height: 84px;
  }
  button.arrow.held { background: #ffe58a; transform: translateY(3px); box-shadow: 0 2px 0 #d4a017; }
  button.arrow:active { transform: translateY(3px); box-shadow: 0 2px 0 #d4a017; }
  p.hint { font-size: 18px; color: #fff; margin: 10px 0 0; text-align: center; }
</style>
</head>
<body>
<h1>Little Jump Adventure</h1>
<div id="bar">
  <span>Stars: <span id="score">0</span></span>
  <span>Best: <span id="best">0</span></span>
  <span>Level: <span id="level">1</span> / 7</span>
</div>
<div id="msg">Use the arrow buttons to move!</div>
<canvas id="c" width="760" height="420"></canvas>
<div id="controls">
  <button id="left" class="arrow" type="button" aria-label="Left">◀</button>
  <button id="jump" class="arrow" type="button" aria-label="Jump">▲</button>
  <button id="right" class="arrow" type="button" aria-label="Right">▶</button>
</div>
<p class="hint">Tap the arrows. Keyboard arrows still work too.</p>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const levelEl = document.getElementById("level");
const msgEl = document.getElementById("msg");

let score = 0, best = 0, level = 1;
let keys = { left: false, right: false, jump: false };

const W = 760, H = 420;
const levels = [
  {
    plats: [
      {x:0,y:360,w:180,h:60},{x:240,y:360,w:140,h:60},{x:440,y:360,w:120,h:60},{x:620,y:360,w:140,h:60}
    ],
    stars: [{x:300,y:320},{x:490,y:320},{x:670,y:320}],
    flag: {x:700,y:290}
  },
  {
    plats: [
      {x:0,y:360,w:140,h:60},{x:200,y:360,w:100,h:60},{x:360,y:360,w:90,h:60},
      {x:510,y:360,w:90,h:60},{x:650,y:360,w:110,h:60}
    ],
    stars: [{x:240,y:320},{x:395,y:320},{x:545,y:320},{x:690,y:320}],
    flag: {x:710,y:290}
  },
  {
    plats: [
      {x:0,y:360,w:120,h:60},{x:190,y:360,w:80,h:60},{x:330,y:360,w:80,h:60},
      {x:470,y:360,w:80,h:60},{x:610,y:360,w:150,h:60}
    ],
    stars: [{x:220,y:320},{x:360,y:320},{x:500,y:320},{x:660,y:320}],
    flag: {x:700,y:290}
  },
  {
    plats: [
      {x:0,y:360,w:100,h:60},{x:170,y:360,w:70,h:60},{x:310,y:360,w:70,h:60},
      {x:450,y:360,w:70,h:60},{x:580,y:360,w:180,h:60}
    ],
    stars: [{x:195,y:320},{x:335,y:320},{x:475,y:320},{x:640,y:320}],
    flag: {x:700,y:290}
  },
  {
    plats: [
      {x:0,y:360,w:110,h:60},{x:180,y:360,w:60,h:60},{x:300,y:360,w:60,h:60},
      {x:420,y:360,w:60,h:60},{x:540,y:360,w:60,h:60},{x:660,y:360,w:100,h:60}
    ],
    stars: [{x:200,y:320},{x:320,y:320},{x:440,y:320},{x:560,y:320},{x:700,y:320}],
    flag: {x:710,y:290}
  },
  {
    plats: [
      {x:20,y:360,w:90,h:60},{x:170,y:360,w:55,h:60},{x:290,y:360,w:55,h:60},
      {x:410,y:360,w:55,h:60},{x:530,y:360,w:55,h:60},{x:650,y:360,w:110,h:60}
    ],
    stars: [{x:185,y:320},{x:305,y:320},{x:425,y:320},{x:545,y:320},{x:690,y:320}],
    flag: {x:710,y:290}
  },
  {
    plats: [
      {x:0,y:360,w:80,h:60},{x:150,y:360,w:50,h:60},{x:260,y:360,w:50,h:60},
      {x:370,y:360,w:50,h:60},{x:480,y:360,w:50,h:60},{x:590,y:360,w:50,h:60},
      {x:690,y:360,w:70,h:60}
    ],
    stars: [{x:165,y:320},{x:275,y:320},{x:385,y:320},{x:495,y:320},{x:605,y:320}],
    flag: {x:710,y:290}
  }
];

let world, player, won;

function startLevel() {
  const L = levels[(level - 1) % levels.length];
  world = {
    plats: L.plats.map(p => ({...p})),
    stars: L.stars.map(s => ({x:s.x, y:s.y, got:false})),
    flag: {...L.flag}
  };
  player = { x: 24, y: 300, w: 36, h: 44, vx: 0, vy: 0, on: false };
  won = false;
  msgEl.textContent = "Level " + level + " — jump the gaps along the ground!";
}
startLevel();

function say(t) { msgEl.textContent = t; }

function rects(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (won) return;
  const p = player;
  if (keys.left) p.vx = -1.9;
  else if (keys.right) p.vx = 1.9;
  else p.vx *= 0.8;
  if (keys.jump && p.on) { p.vy = -5.5; p.on = false; say("Nice jump!"); }
  p.vy += 0.15;
  if (p.vy > 3.8) p.vy = 3.8;
  p.x += p.vx;
  if (p.x < 0) p.x = 0;
  if (p.x + p.w > W) p.x = W - p.w;
  p.on = false;
  for (const pl of world.plats) {
    if (p.vx !== 0 && rects({x:p.x,y:p.y,w:p.w,h:p.h}, pl)) {
      if (p.vx > 0) p.x = pl.x - p.w;
      else p.x = pl.x + pl.w;
      p.vx = 0;
    }
  }
  p.y += p.vy;
  for (const pl of world.plats) {
    if (rects(p, pl)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= pl.y + 8) {
        p.y = pl.y - p.h;
        p.vy = 0;
        p.on = true;
      } else if (p.vy < 0) {
        p.y = pl.y + pl.h;
        p.vy = 0;
      }
    }
  }
  for (const s of world.stars) {
    if (!s.got && Math.abs(p.x + 18 - s.x) < 28 && Math.abs(p.y + 20 - s.y) < 28) {
      s.got = true;
      score += 1;
      if (score > best) best = score;
      scoreEl.textContent = score;
      bestEl.textContent = best;
      say("Yay! You got a star!");
    }
  }
  const f = world.flag;
  if (p.x + p.w > f.x && p.x < f.x + 28 && p.y + p.h > f.y && p.y < f.y + 70) {
    won = true;
    score += 5;
    if (score > best) best = score;
    scoreEl.textContent = score;
    bestEl.textContent = best;
    say("You did it! Amazing jump!");
    setTimeout(() => {
      level += 1;
      if (level > levels.length) {
        level = 1;
        say("You finished all seven levels!");
      }
      levelEl.textContent = level;
      startLevel();
    }, 900);
  }
  if (p.y > H + 40) {
    say("Not quite - try again!");
    player.x = 24; player.y = 300; player.vx = 0; player.vy = 0;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#8fd3ff");
  g.addColorStop(1, "#d4f3c8");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(120, 60, 28, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(620, 50, 22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(400, 40, 18, 0, 7); ctx.fill();
  for (const pl of world.plats) {
    ctx.fillStyle = "#5cbf4a";
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle = "#3d8c32";
    ctx.fillRect(pl.x, pl.y, pl.w, 8);
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(pl.x, pl.y + 8, pl.w, pl.h - 8);
  }
  for (const s of world.stars) {
    if (s.got) continue;
    ctx.font = "28px sans-serif";
    ctx.fillText("⭐", s.x - 14, s.y + 10);
  }
  const f = world.flag;
  ctx.fillStyle = "#c97b2a";
  ctx.fillRect(f.x + 8, f.y, 8, 70);
  ctx.fillStyle = "#ff5a7a";
  ctx.beginPath();
  ctx.moveTo(f.x + 16, f.y);
  ctx.lineTo(f.x + 52, f.y + 14);
  ctx.lineTo(f.x + 16, f.y + 28);
  ctx.fill();
  const p = player;
  ctx.font = "36px sans-serif";
  ctx.fillText("🙂", p.x, p.y + 32);
  ctx.fillStyle = "#2a6cb0";
  ctx.fillRect(p.x + 4, p.y + 34, 28, 8);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

function setHeld() {
  document.getElementById("left").classList.toggle("held", keys.left);
  document.getElementById("right").classList.toggle("held", keys.right);
  document.getElementById("jump").classList.toggle("held", keys.jump);
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === "ArrowUp" || e.key === " " || e.key === "w") { keys.jump = true; e.preventDefault(); }
  setHeld();
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.key === "ArrowUp" || e.key === " " || e.key === "w") keys.jump = false;
  setHeld();
});
function hold(id, key) {
  const b = document.getElementById(id);
  const on = ev => { ev.preventDefault(); keys[key] = true; setHeld(); };
  const off = ev => { ev.preventDefault(); keys[key] = false; setHeld(); };
  b.addEventListener("mousedown", on);
  b.addEventListener("mouseup", off);
  b.addEventListener("mouseleave", off);
  b.addEventListener("touchstart", on, {passive:false});
  b.addEventListener("touchend", off);
  b.addEventListener("touchcancel", off);
}
hold("left", "left");
hold("right", "right");
hold("jump", "jump");
</script>
</body>
</html>
