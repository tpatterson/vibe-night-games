<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk Dance Boss</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: linear-gradient(#1b2438, #3d2a4a 55%, #f0c36a);
    color: #24324a;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
  h1 { margin: 4px 0 8px; font-size: 2rem; text-align: center; color: #fff8e8; }
  .hud {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: space-between; align-items: center;
    background: #fff8; border-radius: 16px; padding: 10px 14px; font-size: 1.1rem;
  }
  .hpwrap { flex: 1 1 220px; }
  .hpwrap b { font-size: 1rem; word-break: break-all; }
  .bar { height: 22px; background: #ddd; border-radius: 12px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 100%; background: #e24b4b; }
  .bar.you > div { background: #3cb371; width: 100%; }
  .bar.hot > div { background: #ff7a18; }
  #stage {
    margin-top: 10px; width: 100%; height: 420px;
    background: linear-gradient(#6ec6ff, #d7f3ff 40%, #f7e7c4);
    border: 6px solid #c9a227; border-radius: 20px;
    position: relative; overflow: hidden; touch-action: none;
  }
  .boss, .player { position: absolute; }
  .boss { top: 6px; width: 92px; height: 92px; z-index: 3; }
  .player { bottom: 6px; width: 64px; height: 78px; z-index: 2; }
  .shadow {
    position: absolute; bottom: 8px; width: 86px; height: 22px;
    background: radial-gradient(ellipse, #ff2a2acc, #7a1020 70%, #0000);
    border: 3px solid #ff6b6b; border-radius: 50%; display: none; z-index: 1;
    box-shadow: 0 0 16px #ff2a2a;
  }
  .burst {
    position: absolute; width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, #fff8c4 0%, #ffb347 40%, #ff6b6b55 68%, #ff6b6b00 78%);
    box-shadow: 0 0 28px #ffe08a;
    display: none; z-index: 4; pointer-events: none;
  }
  .lose {
    display: none; position: absolute; inset: 0; z-index: 8;
    background: #24324acc; color: #fff8e8;
    align-items: center; justify-content: center; text-align: center;
    font-size: 3.2rem; font-weight: bold; padding: 16px;
  }
  .lose small { display: block; font-size: 1.3rem; margin-top: 8px; font-weight: normal; }
  .orb {
    position: absolute; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
  }
  .gold { width: 30px; height: 46px; background: none; }
  .thread {
    position: absolute; width: 3px; height: 40px; border-radius: 3px;
    background: linear-gradient(#fffef8, #f4e7b0 45%, #fff);
    box-shadow: 1px 0 0 #e7d28a, -1px 0 0 #fff;
  }
  .thread.t2 { left: 12px; height: 34px; top: 6px; transform: rotate(7deg); }
  .thread.t3 { left: 5px; height: 36px; top: 4px; transform: rotate(-8deg); }
  .thread.t1 { left: 18px; }
  .swirl, .bellatk, .dash {
    border-radius: 50%;
    background: radial-gradient(circle, #ffd0c8, #e24b4b 55%, #8d1d2c);
    box-shadow: 0 0 0 4px #ff2a2a, 0 0 14px #ff4d4d;
    color: #fff8e8; font-weight: bold; font-size: 1.3rem;
  }
  .bellatk { border-radius: 10px 10px 18px 18px; width: 40px; height: 44px; }
  .dash {
    width: 58px; height: 28px; border-radius: 4px 18px 4px 18px;
    background: linear-gradient(90deg, #ff2a2a, #ffd0c8 50%, #c81e1e);
    transform: rotate(-12deg);
  }
  .msg { min-height: 2.4em; text-align: center; font-size: 1.25rem; margin: 10px 0; color: #fff8e8; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font-size: 1.3rem; padding: 14px 18px; border: none; border-radius: 16px;
    background: #e24b4b; color: white; cursor: pointer;
  }
  button.alt { background: #c9a227; color: #24324a; }
  button.heal { background: #3cb371; }
  button.jump { background: #5b7cff; }
  button.boom { background: #ff7a18; }
  button:active { transform: scale(0.97); }
  .cloak {
    position: absolute; left: 14px; top: 22px; width: 36px; height: 48px;
    background: #d23b3b; border-radius: 18px 18px 10px 10px;
    box-shadow: inset -6px 0 0 #a81f2a;
  }
  .hood {
    position: absolute; left: 16px; top: 6px; width: 32px; height: 28px;
    background: #fff6ea; border-radius: 16px 16px 10px 10px;
  }
  .mask {
    position: absolute; left: 6px; top: 8px; width: 20px; height: 14px;
    background: #fff; border-radius: 8px; box-shadow: inset 0 0 0 2px #24324a;
  }
  .eye { position: absolute; top: 4px; width: 4px; height: 6px; background: #24324a; border-radius: 2px; }
  .eye.l { left: 4px; } .eye.r { right: 4px; }
  .needle {
    position: absolute; right: 0; top: 28px; width: 28px; height: 4px;
    background: #f4f1ea; border-radius: 2px; transform: rotate(-18deg);
  }
  .wing {
    position: absolute; top: 18px; width: 34px; height: 42px;
    background: #f7f0ff; border: 3px solid #8d6bb5; border-radius: 50% 50% 40% 40%;
  }
  .wing.l { left: 2px; transform: rotate(-18deg); }
  .wing.r { right: 2px; transform: rotate(18deg); }
  .moth {
    position: absolute; left: 28px; top: 22px; width: 36px; height: 40px;
    background: #ffe08a; border-radius: 18px;
  }
  .feel { position: absolute; top: 8px; width: 2px; height: 16px; background: #5b4636; }
  .feel.l { left: 36px; transform: rotate(-20deg); }
  .feel.r { left: 52px; transform: rotate(20deg); }
  .bell {
    position: absolute; left: 36px; bottom: 6px; width: 18px; height: 16px;
    background: #c9a227; border-radius: 4px 4px 10px 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Silk Dance Boss</h1>
  <div class="hud">
    <div class="hpwrap">
      You <b id="php">100</b> / 100
      <div class="bar you" id="pbar"><div id="pfill"></div></div>
    </div>
    <div>Heals <b id="heals">0</b></div>
    <div>Burst <b id="cool">Ready</b></div>
    <div>Score <b id="score">0</b></div>
    <div class="hpwrap">
      Moth <b id="hp">6999777</b> / 6999777
      <div class="bar" id="bar"><div id="fill"></div></div>
    </div>
  </div>
  <div id="stage">
    <div class="shadow" id="shadow"></div>
    <div class="burst" id="burst"></div>
    <div class="lose" id="lose">You lose<small>Not quite - try again!</small></div>
    <div class="boss" id="boss">
      <div class="wing l"></div><div class="wing r"></div>
      <div class="feel l"></div><div class="feel r"></div>
      <div class="moth"></div><div class="bell"></div>
    </div>
    <div class="player" id="player">
      <div class="cloak"></div>
      <div class="hood"><div class="mask"><i class="eye l"></i><i class="eye r"></i></div></div>
      <div class="needle"></div>
    </div>
  </div>
  <div class="msg" id="msg">Press S to start. Red shapes hurt you. Pale threads are safe silk.</div>
  <div class="controls">
    <button id="left">◀ Left</button>
    <button class="jump" id="jumpbtn">Leap G</button>
    <button class="boom" id="boombtn">Burst F</button>
    <button class="alt" id="start">Start S</button>
    <button class="heal" id="healbtn">Heal H</button>
    <button id="right">Right ▶</button>
  </div>
</div>
<script>
const stage = document.getElementById("stage");
const player = document.getElementById("player");
const boss = document.getElementById("boss");
const shadow = document.getElementById("shadow");
const burst = document.getElementById("burst");
const lose = document.getElementById("lose");
const msg = document.getElementById("msg");
const scoreEl = document.getElementById("score");
const hpEl = document.getElementById("hp");
const fill = document.getElementById("fill");
const bar = document.getElementById("bar");
const phpEl = document.getElementById("php");
const pfill = document.getElementById("pfill");
const healsEl = document.getElementById("heals");
const coolEl = document.getElementById("cool");
const MAX = 6999777;
const HALF = 3499889;
const CHIP = 139995;
const PMAX = 100;
let px = 160, py = 6, pvy = 0, score = 0, php = PMAX, heals = 0, silks = 0;
let hp = MAX, running = false, rushed = false, leapHit = false;
let orbs = [], bossX = 200, bossY = 6, dir = 1, last = 0, spawn = 0;
let smash = "idle", smashT = 0, smashX = 0, hurtLock = false;
let coolUntil = 0, burstUntil = 0;
const keys = { left: false, right: false };

function layout() {
  px = Math.max(0, Math.min(stage.clientWidth - 64, px));
  player.style.left = px + "px";
  player.style.bottom = py + "px";
}
function paintHp() {
  hpEl.textContent = hp;
  fill.style.width = (hp / MAX * 100) + "%";
  bar.classList.toggle("hot", hp <= HALF);
  phpEl.textContent = php;
  pfill.style.width = (php / PMAX * 100) + "%";
  healsEl.textContent = heals;
}
function cheer(text) { msg.textContent = text; }
function resetRound() {
  orbs.forEach(o => o.el.remove());
  orbs = [];
  hp = MAX; php = PMAX; heals = 0; silks = 0;
  rushed = false; smash = "idle"; smashT = 0; hurtLock = false;
  bossY = 6; py = 6; pvy = 0; leapHit = false;
  coolUntil = 0; burstUntil = 0;
  shadow.style.display = "none";
  burst.style.display = "none";
  lose.style.display = "none";
  coolEl.textContent = "Ready";
  paintHp();
  score = 0; scoreEl.textContent = score;
  player.style.bottom = "6px";
}
function speedMul() { return hp <= HALF ? 1.85 : 1; }
function silkHit(note) {
  score += 10;
  hp = Math.max(0, hp - CHIP);
  if (!rushed && hp <= HALF && hp > 0) {
    rushed = true;
    cheer("Half health! Bells, smash, and a faster dance!");
  } else if (hp <= 0) {
    cheer("You calmed the huge health bar! Wonderful!");
    running = false;
  } else {
    cheer(note);
  }
  scoreEl.textContent = score;
  paintHp();
}
function spawnOrb() {
  const w = stage.clientWidth;
  const half = hp <= HALF;
  const roll = Math.random();
  let kind = "swirl";
  if (roll < 0.36) kind = "gold";
  else if (!half || roll < 0.62) kind = "swirl";
  else if (roll < 0.82) kind = "bell";
  else kind = "dash";
  const el = document.createElement("div");
  el.className = "orb " + (kind === "gold" ? "gold" : kind === "bell" ? "bellatk" : kind === "dash" ? "dash" : "swirl");
  if (kind === "gold") {
    el.innerHTML = '<span class="thread t3"></span><span class="thread t2"></span><span class="thread t1"></span>';
  } else {
    el.textContent = "!";
  }
  const x = 12 + Math.random() * (w - 64);
  el.style.left = x + "px";
  el.style.top = "90px";
  stage.appendChild(el);
  const m = speedMul();
  const vy = (kind === "gold" ? 3.2 : kind === "dash" ? 6.4 : kind === "bell" ? 4.6 : 5) * m;
  const vx = kind === "dash" ? (Math.random() < 0.5 ? -2.2 : 2.2) * m : 0;
  orbs.push({ el, x, y: 90, kind, vy, vx });
}
function hit(o) {
  const pr = player.getBoundingClientRect();
  const r = o.el.getBoundingClientRect();
  return !(r.right < pr.left + 8 || r.left > pr.right - 8 || r.bottom < pr.top + 10 || r.top > pr.bottom - 6);
}
function bossAbove() {
  const pr = player.getBoundingClientRect();
  const br = boss.getBoundingClientRect();
  const overlapX = !(br.right < pr.left + 4 || br.left > pr.right - 4);
  return overlapX && br.bottom <= pr.top + 18 && br.top < pr.top;
}
function hurt(note) {
  if (hurtLock || !running) return;
  hurtLock = true;
  setTimeout(() => { hurtLock = false; }, 500);
  php = Math.max(0, php - 10);
  paintHp();
  if (php <= 0) {
    running = false;
    lose.style.display = "flex";
    cheer("You lose. Not quite - try again!");
  } else {
    cheer(note);
  }
}
function useHeal() {
  if (!running) return;
  if (heals < 1) { cheer("No heal yet. Catch 5 gold silks first!"); return; }
  if (php >= PMAX) { cheer("You are already full of energy!"); return; }
  heals -= 1;
  php = Math.min(PMAX, php + 7);
  paintHp();
  cheer("A silk heal! You gained 7 health.");
}
function leap() {
  if (!running || py > 8) return;
  pvy = 14;
  leapHit = false;
  cheer("Up you go! Line up under the moth!");
}
function boom() {
  if (!running) return;
  const now = performance.now();
  if (now < coolUntil) {
    cheer("Not quite - try again! Burst needs " + Math.ceil((coolUntil - now) / 1000) + " more seconds.");
    return;
  }
  coolUntil = now + 10000;
  burstUntil = now + 520;
  burst.style.display = "block";
  burst.style.left = (px - 108) + "px";
  burst.style.bottom = (py - 90) + "px";
  silkHit("Huge silk burst! It hit the moth no matter where you stood!");
}
function startSmash() {
  smash = "warn";
  smashT = 0;
  smashX = Math.max(8, Math.min(stage.clientWidth - 96, px - 14));
  shadow.style.display = "block";
  shadow.style.left = (smashX + 3) + "px";
  cheer("Red shadow on the floor! Step aside before the smash!");
}
function doSmash(dt) {
  const h = stage.clientHeight;
  smashT += dt;
  if (smash === "warn") {
    bossY = 6;
    bossX = smashX;
    if (smashT > 700) { smash = "down"; smashT = 0; }
  } else if (smash === "down") {
    bossY = Math.min(h - 100, 6 + smashT * 1.1);
    if (bossY >= h - 100) {
      smash = "land";
      smashT = 0;
      const br = boss.getBoundingClientRect();
      const pr = player.getBoundingClientRect();
      const overlap = !(br.right < pr.left + 6 || br.left > pr.right - 6);
      if (overlap && py < 40) hurt("Not quite - try again! The smash took 10 health.");
    }
  } else if (smash === "land") {
    bossY = h - 100;
    if (smashT > 280) { smash = "up"; smashT = 0; }
  } else if (smash === "up") {
    bossY = Math.max(6, h - 100 - smashT * 0.7);
    if (bossY <= 6) { smash = "idle"; shadow.style.display = "none"; bossY = 6; }
  }
  boss.style.top = bossY + "px";
  boss.style.left = bossX + "px";
}
function loop(t) {
  if (!running) return;
  const w = stage.clientWidth;
  const dt = Math.min(32, t - last || 16);
  last = t;
  const m = speedMul();
  const half = hp <= HALF;
  const wait = Math.ceil((coolUntil - t) / 1000);
  coolEl.textContent = wait > 0 ? wait + "s" : "Ready";
  if (t > burstUntil) burst.style.display = "none";
  if (keys.left) px -= 0.42 * dt;
  if (keys.right) px += 0.42 * dt;
  px = Math.max(0, Math.min(w - 64, px));
  pvy -= 0.045 * dt;
  py += pvy * dt * 0.06;
  if (py <= 6) { py = 6; pvy = 0; leapHit = false; }
  if (py > 330) { py = 330; pvy = 0; }
  player.style.left = px + "px";
  player.style.bottom = py + "px";
  if (py > 20 && !leapHit && bossAbove()) {
    leapHit = true;
    silkHit("Nice leap! That hit as hard as one gold silk!");
    if (!running) return;
  }
  if (smash === "idle") {
    bossX += dir * 0.22 * m * dt;
    if (bossX < 8 || bossX > w - 96) dir *= -1;
    boss.style.left = bossX + "px";
    boss.style.top = "6px";
    if (half && Math.random() < 0.004) startSmash();
  } else {
    doSmash(dt);
    if (!running) return;
  }
  spawn += dt;
  if (spawn > (half ? 360 : 620)) { spawn = 0; spawnOrb(); }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.y += o.vy * dt * 0.06;
    o.x += o.vx * dt * 0.06;
    if (o.x < 4 || o.x > w - 40) o.vx *= -1;
    o.el.style.top = o.y + "px";
    o.el.style.left = o.x + "px";
    if (hit(o)) {
      o.el.remove();
      orbs.splice(i, 1);
      if (o.kind === "gold") {
        silks += 1;
        if (silks % 5 === 0) heals += 1;
        silkHit(silks % 5 === 0 ? "Five silks! Press H to heal 7 points." : "Nice catch! Health is going down!");
        if (!running) return;
      } else {
        hurt("Not quite - try again! That attack took 10 health.");
        if (!running) return;
      }
    } else if (o.y > 400) {
      o.el.remove();
      orbs.splice(i, 1);
    }
  }
  if (running) requestAnimationFrame(loop);
}
function startGame() {
  resetRound();
  running = true;
  last = 0;
  cheer("Dodge the red attacks. Catch the pale silk threads!");
  requestAnimationFrame(loop);
}
document.getElementById("left").addEventListener("pointerdown", () => keys.left = true);
document.getElementById("right").addEventListener("pointerdown", () => keys.right = true);
window.addEventListener("pointerup", () => { keys.left = false; keys.right = false; });
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
  if (e.key === "h" || e.key === "H") useHeal();
  if (e.key === "g" || e.key === "G") leap();
  if (e.key === "f" || e.key === "F") boom();
  if (e.key === "s" || e.key === "S") startGame();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});
document.getElementById("healbtn").onclick = useHeal;
document.getElementById("jumpbtn").onclick = leap;
document.getElementById("boombtn").onclick = boom;
document.getElementById("start").onclick = startGame;
paintHp();
layout();
window.addEventListener("resize", layout);
</script>
</body>
</html>
