<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendly Paddle Pong</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: linear-gradient(160deg, #3c6eae, #b22234 55%, #ffffff);
    color: #0b2545;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
  }
  .wrap {
    width: min(640px, 100%);
    background: #fffdf8;
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 10px 0 #b22234;
    border: 6px solid #3c6eae;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 2rem;
    text-align: center;
    color: #b22234;
  }
  p.hint {
    text-align: center;
    margin: 0 0 10px;
    font-size: 1.1rem;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 8px;
  }
  canvas {
    width: 100%;
    height: auto;
    background: #0b2545;
    border-radius: 16px;
    display: block;
    touch-action: none;
    cursor: none;
    border: 4px solid #ffffff;
  }
  .msg {
    min-height: 2.4em;
    margin: 10px 0;
    text-align: center;
    font-size: 1.25rem;
    background: #e8f1ff;
    border-radius: 12px;
    padding: 8px;
    border: 3px solid #3c6eae;
  }
  button {
    width: 100%;
    font-size: 1.4rem;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: #b22234;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { transform: translateY(2px); }
  .progress {
    height: 16px;
    background: #d7e6f2;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #b22234, #ffffff, #3c6eae);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Friendly Paddle Pong</h1>
  <p class="hint">Slide the star paddle. Sparkles burst when you hit the fireball.</p>
  <div class="bar">
    <span>You: <span id="you">0</span></span>
    <span>Buddy: <span id="buddy">0</span></span>
  </div>
  <canvas id="court" width="600" height="360"></canvas>
  <div class="msg" id="msg">First to 5 wins. Stars and stripes, you can do it!</div>
  <div class="progress"><div id="fill"></div></div>
  <button id="again" type="button">Play again</button>
</div>
<script>
const canvas = document.getElementById("court");
const ctx = canvas.getContext("2d");
const youEl = document.getElementById("you");
const buddyEl = document.getElementById("buddy");
const msgEl = document.getElementById("msg");
const fillEl = document.getElementById("fill");
const WIN = 5;
const cheers = [
  "Not quite - try again! You are doing great.",
  "So close! Your next hit will be awesome.",
  "Good try! Keep your star paddle ready.",
  "Almost! You are getting better every rally.",
  "Oops, the fireball zoomed past! You have got this.",
  "Nice effort! Watch the bounce and try again."
];
const facts = [
  "Moms give the warmest hugs after a long day.",
  "A mom cheering from the sidelines makes games feel bigger.",
  "Moms remember the little things that make you smile.",
  "A mom's bedtime story can turn an ordinary night into an adventure.",
  "Moms pack snacks that taste like a tiny celebration.",
  "A proud mom clap is louder than any scoreboard.",
  "Moms know just when you need a glass of water and a kind word.",
  "Home feels extra cozy when Mom is nearby."
];
const sparkColors = ["#fff6c8", "#ffe08a", "#ffb703", "#ff8a3d", "#ffffff", "#7dffb3", "#ff4d6d", "#7ec8ff"];

let you = 0, buddy = 0, over = false, miss = 0;
let speed = 1;
let fact = facts[0];
let paddleY = 140;
const paddleH = 80, paddleW = 16;
let ball = { x: 300, y: 180, vx: 4.2, vy: 3.1, r: 10 };
let buddyY = 140;
let tick = 0;
let sparks = [];

function pickFact() {
  let next = fact;
  while (next === fact) next = facts[Math.floor(Math.random() * facts.length)];
  fact = next;
}

function wrapFact(text) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  words.forEach((word) => {
    const tryLine = line ? line + " " + word : word;
    if (ctx.measureText(tryLine).width > 250 && line) {
      lines.push(line);
      line = word;
    } else {
      line = tryLine;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function resetBall(dir) {
  ball.x = 300;
  ball.y = 160 + Math.random() * 40;
  const baseX = 4 + Math.random();
  const baseY = 2.4 + Math.random() * 2;
  ball.vx = dir * baseX * speed;
  ball.vy = (Math.random() < 0.5 ? -1 : 1) * baseY * speed;
}

function setMsg(text) { msgEl.textContent = text; }

function updateProgress() {
  const best = Math.max(you, buddy);
  fillEl.style.width = Math.min(100, (best / WIN) * 100) + "%";
}

function burst(x, y) {
  for (let i = 0; i < 16; i++) {
    const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
    const sp = 1.4 + Math.random() * 3.2;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      size: 3 + Math.random() * 4,
      color: sparkColors[i % sparkColors.length]
    });
  }
}

function point(player) {
  if (over) return;
  if (player === "you") {
    you++;
    setMsg("Nice hit! The fireball is a little faster now. Keep going!");
  } else {
    buddy++;
    miss++;
    setMsg(cheers[miss % cheers.length] + " A bit faster next time!");
  }
  speed *= 1.2;
  pickFact();
  youEl.textContent = you;
  buddyEl.textContent = buddy;
  updateProgress();
  if (you >= WIN || buddy >= WIN) {
    over = true;
    setMsg(you >= WIN
      ? "You won! Stars and stripes, what a super game!"
      : "Good try! You played bravely. Want another round?");
    return;
  }
  resetBall(player === "you" ? 1 : -1);
}

function pointerY(e) {
  const rect = canvas.getBoundingClientRect();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const scale = canvas.height / rect.height;
  paddleY = (clientY - rect.top) * scale - paddleH / 2;
  paddleY = Math.max(8, Math.min(canvas.height - paddleH - 8, paddleY));
}
canvas.addEventListener("mousemove", pointerY);
canvas.addEventListener("touchmove", pointerY, { passive: true });

function star(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const b = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(b) * r * 0.42, Math.sin(b) * r * 0.42);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCourt() {
  const stripe = 28;
  for (let i = 0; i < 13; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#b22234" : "#ffffff";
    ctx.fillRect(0, i * stripe, canvas.width, stripe);
  }
  ctx.fillStyle = "#3c6eae";
  ctx.fillRect(0, 0, 220, stripe * 7);
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 5; col++) {
      star(22 + col * 40, 18 + row * 42, 8, "#ffffff");
    }
  }
  ctx.fillStyle = "rgba(11, 37, 69, 0.35)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawFact() {
  ctx.font = "bold 16px Trebuchet MS, Verdana, sans-serif";
  ctx.textAlign = "center";
  const lines = wrapFact(fact);
  const boxW = 290;
  const boxH = 26 + lines.length * 22;
  let cx = canvas.width / 2;
  if (you > buddy) cx = canvas.width * 0.32;
  else if (buddy > you) cx = canvas.width * 0.68;
  let x = cx - boxW / 2;
  x = Math.max(8, Math.min(canvas.width - boxW - 8, x));
  let y = ball.y - boxH - 22;
  if (y < 8) y = ball.y + 22;
  if (y + boxH > canvas.height - 8) y = canvas.height - boxH - 8;
  ctx.fillStyle = "rgba(11, 37, 69, 0.88)";
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = you > buddy ? "#ffd84a" : buddy > you ? "#7ec8ff" : "#ffffff";
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, boxW, boxH);
  ctx.fillStyle = "#ffe08a";
  lines.forEach((line, i) => {
    ctx.fillText(line, x + boxW / 2, y + 22 + i * 22);
  });
}

function ballSpeed() {
  return Math.hypot(ball.vx, ball.vy);
}

function drawBall() {
  const pace = Math.min(ballSpeed() / 6, 2.4);
  const ang = Math.atan2(ball.vy, ball.vx);
  const tail = 18 + pace * 10;
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ang);
  const flame = ctx.createLinearGradient(-tail, 0, ball.r, 0);
  flame.addColorStop(0, "rgba(255, 80, 20, 0)");
  flame.addColorStop(0.45, "rgba(255, 120, 30, 0.55)");
  flame.addColorStop(1, "rgba(255, 210, 70, 0.9)");
  ctx.fillStyle = flame;
  ctx.beginPath();
  ctx.moveTo(ball.r * 0.4, 0);
  ctx.quadraticCurveTo(-tail * 0.45, -8 - pace * 2, -tail, 0);
  ctx.quadraticCurveTo(-tail * 0.45, 8 + pace * 2, ball.r * 0.4, 0);
  ctx.fill();
  ctx.restore();
  const glow = 16 + pace * 8;
  const halo = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, glow);
  halo.addColorStop(0, "rgba(255, 250, 200, 0.95)");
  halo.addColorStop(0.45, "rgba(255, 140, 40, 0.7)");
  halo.addColorStop(1, "rgba(180, 30, 0, 0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, glow, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ff5a1f";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r + pace * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffb703";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 0.62, 0, Math.PI * 2);
  ctx.fill();
  star(ball.x - 1, ball.y - 1, ball.r * 0.35, "#fff6c8");
}

function drawSparks() {
  sparks.forEach((s) => {
    ctx.save();
    ctx.globalAlpha = Math.max(s.life, 0);
    ctx.translate(s.x, s.y);
    ctx.rotate(tick * 0.05 + s.size);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    for (let p = 0; p < 5; p++) {
      const a = -Math.PI / 2 + p * Math.PI * 2 / 5;
      const b = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * s.size, Math.sin(a) * s.size);
      ctx.lineTo(Math.cos(b) * s.size * 0.4, Math.sin(b) * s.size * 0.4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function loop() {
  tick++;
  if (!over) {
    const target = ball.y - paddleH / 2;
    buddyY += (target - buddyY) * 0.08;
    buddyY = Math.max(8, Math.min(canvas.height - paddleH - 8, buddyY));
    ball.x += ball.vx;
    ball.y += ball.vy;
    if (ball.y < ball.r || ball.y > canvas.height - ball.r) ball.vy *= -1;
    if (ball.x - ball.r < 28 && ball.y > paddleY && ball.y < paddleY + paddleH && ball.vx < 0) {
      ball.vx = Math.abs(ball.vx) + 0.15;
      ball.vy += (ball.y - (paddleY + paddleH / 2)) * 0.05;
      burst(ball.x, ball.y);
    }
    if (ball.x + ball.r > canvas.width - 28 && ball.y > buddyY && ball.y < buddyY + paddleH && ball.vx > 0) {
      ball.vx = -Math.abs(ball.vx) - 0.1;
    }
    if (ball.x < -20) point("buddy");
    if (ball.x > canvas.width + 20) point("you");
  }
  sparks = sparks.filter((s) => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.04;
    s.life -= 0.025;
    s.size *= 0.985;
    return s.life > 0;
  });
  drawCourt();
  ctx.setLineDash([8, 10]);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(300, 10);
  ctx.lineTo(300, 350);
  ctx.stroke();
  ctx.setLineDash([]);
  drawFact();
  ctx.fillStyle = "#b22234";
  ctx.fillRect(12, paddleY, paddleW, paddleH);
  star(20, paddleY + paddleH / 2, 10, "#ffd84a");
  ctx.fillStyle = "#3c6eae";
  ctx.fillRect(canvas.width - 28, buddyY, paddleW, paddleH);
  star(canvas.width - 20, buddyY + paddleH / 2, 10, "#ffffff");
  drawBall();
  drawSparks();
  requestAnimationFrame(loop);
}

document.getElementById("again").onclick = () => {
  you = 0; buddy = 0; over = false; miss = 0; speed = 1;
  sparks = [];
  youEl.textContent = "0";
  buddyEl.textContent = "0";
  updateProgress();
  pickFact();
  setMsg("New game! Slide your star paddle and have fun.");
  resetBall(-1);
};

pickFact();
resetBall(-1);
updateProgress();
loop();
</script>
</body>
</html>
