<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Spelling Fun</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #fff6d8 0%, #c8f0ff 100%);
    min-height: 100vh;
    color: #24324a;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 28px;
    padding: 22px 18px 26px;
    box-shadow: 0 10px 0 #f3b23a;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 34px;
    color: #e86a2c;
  }
  .sub {
    text-align: center;
    font-size: 18px;
    margin: 6px 0 12px;
  }
  .stats {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .pill {
    background: #e8f8ff;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 18px;
    font-weight: bold;
  }
  .bar {
    height: 16px;
    background: #eee;
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 16px;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: #5ecf6a;
  }
  .animal {
    font-size: 92px;
    text-align: center;
    line-height: 1.1;
  }
  .prompt {
    text-align: center;
    font-size: 24px;
    margin: 4px 0 14px;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  button {
    font-size: 26px;
    padding: 16px 12px;
    border: none;
    border-radius: 18px;
    background: #6aa8ff;
    color: white;
    cursor: pointer;
    letter-spacing: 1px;
    font-weight: bold;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { cursor: default; opacity: 0.9; }
  .msg {
    min-height: 36px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-top: 14px;
  }
  .good { color: #1f9d4a; }
  .try { color: #d07a12; }
  .done { text-align: center; }
  .again {
    background: #ff8a4c;
    width: 100%;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Animal Spelling Fun</h1>
    <p class="sub">Pick the right spelling!</p>
    <div class="stats">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Streak: <span id="streak">0</span></div>
      <div class="pill">Q <span id="qnum">1</span>/10</div>
    </div>
    <div class="bar"><span id="fill"></span></div>
    <div id="play">
      <div class="animal" id="emoji">🐘</div>
      <div class="prompt">How do you spell this animal?</div>
      <div class="choices" id="choices"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
<script>
const animals = [
  { e: "🐘", word: "elephant" },
  { e: "🦒", word: "giraffe" },
  { e: "🐧", word: "penguin" },
  { e: "🐰", word: "rabbit" },
  { e: "🐢", word: "turtle" },
  { e: "🐵", word: "monkey" },
  { e: "🦓", word: "zebra" },
  { e: "🐬", word: "dolphin" },
  { e: "🦋", word: "butterfly" },
  { e: "🦘", word: "kangaroo" }
];
let order = [];
let index = 0;
let score = 0;
let streak = 0;
let locked = false;

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function misspell(word) {
  const letters = word.split("");
  const i = 1 + Math.floor(Math.random() * (letters.length - 1));
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  let ch = alphabet[Math.floor(Math.random() * 26)];
  if (ch === letters[i]) ch = alphabet[(alphabet.indexOf(ch) + 1) % 26];
  letters[i] = ch;
  const bad = letters.join("");
  return bad === word ? word.slice(0, -1) + "z" : bad;
}

function start() {
  order = shuffle(animals).slice(0, 10);
  index = 0;
  score = 0;
  streak = 0;
  document.getElementById("score").textContent = "0";
  document.getElementById("streak").textContent = "0";
  show();
}

function show() {
  locked = false;
  const item = order[index];
  document.getElementById("emoji").textContent = item.e;
  document.getElementById("qnum").textContent = String(index + 1);
  document.getElementById("fill").style.width = (index * 10) + "%";
  document.getElementById("msg").textContent = "";
  document.getElementById("msg").className = "msg";
  const wrongs = [];
  while (wrongs.length < 2) {
    const w = misspell(item.word);
    if (w !== item.word && wrongs.indexOf(w) === -1) wrongs.push(w);
  }
  const opts = shuffle([item.word].concat(wrongs));
  const box = document.getElementById("choices");
  box.innerHTML = "";
  opts.forEach(function (opt) {
    const b = document.createElement("button");
    b.textContent = opt;
    b.onclick = function () { pick(opt, item.word, b); };
    box.appendChild(b);
  });
}

function pick(choice, right, btn) {
  if (locked) return;
  locked = true;
  const msg = document.getElementById("msg");
  const buttons = document.querySelectorAll("#choices button");
  buttons.forEach(function (b) { b.disabled = true; });
  if (choice === right) {
    score += 1;
    streak += 1;
    msg.textContent = "Yes! " + right + " is right!";
    msg.className = "msg good";
    btn.style.background = "#3cbe62";
  } else {
    streak = 0;
    msg.textContent = "Not quite - try again!";
    msg.className = "msg try";
    btn.style.background = "#f0a04b";
    buttons.forEach(function (b) {
      if (b.textContent === right) b.style.background = "#3cbe62";
    });
  }
  document.getElementById("score").textContent = String(score);
  document.getElementById("streak").textContent = String(streak);
  setTimeout(function () {
    index += 1;
    if (index >= 10) finish();
    else show();
  }, 1100);
}

function finish() {
  document.getElementById("fill").style.width = "100%";
  const play = document.getElementById("play");
  let cheer = "Great trying!";
  if (score >= 8) cheer = "Wow, you are a spelling star!";
  else if (score >= 5) cheer = "Nice work, keep going!";
  play.innerHTML =
    '<div class="done"><div class="animal">🌟</div>' +
    '<div class="prompt">' + cheer + '</div>' +
    '<div class="prompt">You got ' + score + ' out of 10.</div>' +
    '<button class="again" id="again">Play again</button></div>';
  document.getElementById("again").onclick = function () {
    document.getElementById("play").innerHTML =
      '<div class="animal" id="emoji">🐘</div>' +
      '<div class="prompt">How do you spell this animal?</div>' +
      '<div class="choices" id="choices"></div>' +
      '<div class="msg" id="msg"></div>';
    start();
  };
}

start();
</script>
</body>
</html>
