<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Table Fun</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #ffe8a3;
    color: #2b2b2b;
    min-height: 100vh;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 40px;
    color: #d35400;
    text-align: center;
  }
  .sub {
    text-align: center;
    font-size: 20px;
    margin-bottom: 16px;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 22px;
    margin-bottom: 16px;
    border: 4px solid #f39c12;
  }
  .track {
    height: 22px;
    background: #fff;
    border-radius: 12px;
    border: 3px solid #27ae60;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: #2ecc71;
  }
  .card {
    background: #fff8ee;
    border: 5px solid #3498db;
    border-radius: 24px;
    padding: 22px 16px 26px;
    text-align: center;
  }
  .q {
    font-size: 42px;
    margin: 8px 0 18px;
    font-weight: bold;
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  button.choice {
    font-size: 32px;
    padding: 18px 8px;
    border-radius: 18px;
    border: 4px solid #1abc9c;
    background: #e8fff8;
    cursor: pointer;
  }
  button.choice:hover { background: #b8f5e4; }
  .msg {
    min-height: 48px;
    font-size: 26px;
    margin-top: 16px;
    font-weight: bold;
  }
  .good { color: #1e8449; }
  .bad { color: #c0392b; }
  .done {
    font-size: 28px;
    line-height: 1.4;
  }
  button.again {
    margin-top: 12px;
    font-size: 26px;
    padding: 14px 22px;
    border-radius: 16px;
    border: 4px solid #8e44ad;
    background: #f5e6ff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Times Table Fun</h1>
    <p class="sub">Pick the right answer. You can do it!</p>
    <div class="bar">
      <div id="scoreBox">Score: 0</div>
      <div id="streakBox">Streak: 0</div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="card" id="card"></div>
  </div>
  <script>
    var total = 10;
    var asked = 0;
    var score = 0;
    var streak = 0;
    var a, b, correct, options;

    function rand(n) { return Math.floor(Math.random() * n); }

    function makeQuestion() {
      a = 2 + rand(4);
      b = 2 + rand(4);
      correct = a * b;
      var set = {};
      set[correct] = true;
      while (Object.keys(set).length < 4) {
        var wrong = correct + (rand(7) - 3);
        if (wrong > 0 && wrong !== correct) set[wrong] = true;
      }
      options = Object.keys(set).map(Number);
      for (var i = options.length - 1; i > 0; i--) {
        var j = rand(i + 1);
        var t = options[i];
        options[i] = options[j];
        options[j] = t;
      }
    }

    function showQuestion() {
      makeQuestion();
      var html = '<div class="q">What is ' + a + ' × ' + b + '?</div><div class="choices">';
      for (var i = 0; i < options.length; i++) {
        html += '<button class="choice" onclick="pick(' + options[i] + ')">' + options[i] + '</button>';
      }
      html += '</div><div class="msg" id="msg"></div>';
      document.getElementById("card").innerHTML = html;
      paint();
    }

    function paint() {
      document.getElementById("scoreBox").textContent = "Score: " + score;
      document.getElementById("streakBox").textContent = "Streak: " + streak;
      document.getElementById("fill").style.width = Math.round((asked / total) * 100) + "%";
    }

    function pick(n) {
      var msg = document.getElementById("msg");
      var buttons = document.querySelectorAll(".choice");
      for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
      if (n === correct) {
        score = score + 1;
        streak = streak + 1;
        asked = asked + 1;
        msg.className = "msg good";
        msg.textContent = "Yes! Super star!";
      } else {
        streak = 0;
        asked = asked + 1;
        msg.className = "msg bad";
        msg.textContent = "Not quite - try again!";
      }
      paint();
      if (asked >= total) {
        setTimeout(finish, 700);
      } else {
        setTimeout(showQuestion, 800);
      }
    }

    function finish() {
      document.getElementById("card").innerHTML =
        '<div class="done">Round complete!<br>You got ' + score + ' out of ' + total + '.<br>Great trying!</div>' +
        '<button class="again" onclick="restart()">Play again</button>';
    }

    function restart() {
      asked = 0;
      score = 0;
      streak = 0;
      showQuestion();
    }

    restart();
  </script>
</body>
</html>
